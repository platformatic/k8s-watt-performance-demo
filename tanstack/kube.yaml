---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tanstack
  labels:
    app.kubernetes.io/instance: tanstack
spec:
  replicas: 6
  selector:
    matchLabels:
      app.kubernetes.io/instance: tanstack
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: tanstack
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: tanstack
      containers:
        - name: demo-application
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          env:
            - name: SCRIPT_NAME
              value: "start:node"
          ports:
            - name: 'app'
              containerPort: 3000
              protocol: 'TCP'
          readinessProbe:
            httpGet:
              path: '/'
              port: 'app'
              scheme: 'HTTP'
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 1
          livenessProbe:
            httpGet:
              path: '/'
              port: 'app'
              scheme: 'HTTP'
            periodSeconds: 2
            successThreshold: 1
            timeoutSeconds: 1
            failureThreshold: 5
          startupProbe:
            httpGet:
              path: '/'
              port: 'app'
              scheme: 'HTTP'
            initialDelaySeconds: 10
            periodSeconds: 3
            successThreshold: 1
            failureThreshold: 15
          resources:
            requests:
              memory: '3Gi'
              cpu: '1000m'
            limits:
              memory: '3Gi'
              cpu: '1000m'

