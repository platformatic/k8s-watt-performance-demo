      labels:
        app.kubernetes.io/instance: next-latest
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: next-latest
      containers:
        - name: demo-application
          image: IMAGE_LATEST
          imagePullPolicy: Always
          env:
            - name: SCRIPT_NAME
              value: "start:node"
            - name: DB_DELAY_MIN
              value: "1"
            - name: DB_DELAY_MAX
              value: "5"
            - name: DB_DELAY_ENABLED
              value: "true"
          ports:
            - name: 'app'
              containerPort: 3000
              protocol: 'TCP'
          readinessProbe:
            httpGet:
              path: '/'
              port: 'app'
              scheme: 'HTTP'
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 1
          livenessProbe:
            httpGet:
              path: '/'
              port: 'app'
              scheme: 'HTTP'
            periodSeconds: 2
            successThreshold: 1
            timeoutSeconds: 1
            failureThreshold: 5
          startupProbe:
            httpGet:
              path: '/'
              port: 'app'
              scheme: 'HTTP'
            initialDelaySeconds: 10
            periodSeconds: 3
            successThreshold: 1
            failureThreshold: 15
          resources:
            requests:
              memory: '2Gi'
              cpu: '1000m'
            limits:
              memory: '2Gi'
              cpu: '1000m'

---
apiVersion: v1
kind: Service
metadata:
  name: next-stable
  labels:
    app.kubernetes.io/instance: next-stable
  annotations:
    benchmark.platformatic.dev/expose: "true"
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internal"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/instance: next-stable
  ports:
    - name: app
      protocol: 'TCP'
      port: 80
      targetPort: 'app'

---
apiVersion: v1
kind: Service
metadata:
  name: next-latest
  labels:
    app.kubernetes.io/instance: next-latest
  annotations:
    benchmark.platformatic.dev/expose: "true"
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internal"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/instance: next-latest
  ports:
    - name: app
      protocol: 'TCP'
      port: 80
      targetPort: 'app'
