---
apiVersion: v1
kind: Service
metadata:
  name: next
  labels:
    app.kubernetes.io/instance: next
  annotations:
    benchmark.platformatic.dev/expose: "true"
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internal"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/instance: next
  ports:
    - name: app
      protocol: 'TCP'
      port: 80
      targetPort: 'app'

