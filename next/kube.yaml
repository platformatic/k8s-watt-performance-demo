---
# Next.js 16.2.9 (latest stable) — Node runtime. Web streams (no node-streams path).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: next-stable
  labels:
    app.kubernetes.io/instance: next-stable
spec:
  replicas: 6
  selector:
    matchLabels:
      app.kubernetes.io/instance: next-stable
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: next-stable
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: next-stable
      containers:
        - name: demo-application
          image: IMAGE_STABLE
          imagePullPolicy: Always
          env:
            - name: SCRIPT_NAME
              value: "start:node"
            - name: DB_DELAY_MIN
              value: "1"
            - name: DB_DELAY_MAX
              value: "5"
            - name: DB_DELAY_ENABLED
              value: "true"
          ports:
            - name: 'app'
              containerPort: 3000
              protocol: 'TCP'
          readinessProbe:
            httpGet:
              path: '/'
              port: 'app'
              scheme: 'HTTP'
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 1
          livenessProbe:
            httpGet:
              path: '/'
              port: 'app'
              scheme: 'HTTP'
            periodSeconds: 2
            successThreshold: 1
            timeoutSeconds: 1
            failureThreshold: 5
          startupProbe:
            httpGet:
              path: '/'
              port: 'app'
              scheme: 'HTTP'
            initialDelaySeconds: 10
            periodSeconds: 3
            successThreshold: 1
            failureThreshold: 15
          resources:
            requests:
              memory: '2Gi'
              cpu: '1000m'
            limits:
              memory: '2Gi'
              cpu: '1000m'

---
# Next.js 16.3.0-canary.72 (latest canary) — Node runtime. Node streams (baked on).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: next-latest
  labels:
    app.kubernetes.io/instance: next-latest
spec:
  replicas: 6
  selector:
