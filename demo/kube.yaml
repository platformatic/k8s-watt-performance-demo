---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: next
  labels:
    app.kubernetes.io/instance: next
spec:
  replicas: 6
  selector:
    matchLabels:
      app.kubernetes.io/instance: next
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: next
    spec:
      containers:
        - name: demo-application
          image: platformatic/watt-perf-demos-next:experiment-b3e184ad179ed02195d81e926be6aa11bbc0cc30
          imagePullPolicy: Always
          env:
            - name: SCRIPT_NAME
              value: "start:node"
          ports:
            - name: 'app'
              containerPort: 3000
              protocol: 'TCP'
          readinessProbe:
            httpGet:
              path: '/'
              port: 'app'
              scheme: 'HTTP'
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 1
          livenessProbe:
            httpGet:
              path: '/'
              port: 'app'
              scheme: 'HTTP'
            periodSeconds: 2
            successThreshold: 1
            timeoutSeconds: 1
            failureThreshold: 5
          startupProbe:
            httpGet:
              path: '/'
              port: 'app'
              scheme: 'HTTP'
            initialDelaySeconds: 10
            periodSeconds: 3
            successThreshold: 1
            failureThreshold: 15
          resources:
            requests:
              memory: '2Gi'
              cpu: '1000m'
            limits:
              memory: '2Gi'
              cpu: '1000m'

