name: Build demo and cannon images

on:
  push:
    branches:
      - main
    paths:
      - 'demo/**'

jobs:
  build-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to registry
      uses: docker/login-action@v3
      with:
        username: plfmzugm
        password: ${{ secrets.DOCKER_TOKEN }}

    - name: Build and push image
      uses: docker/build-push-action@v6
      with:
        context: ./demos/api
        file: ./demos/api/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          platformatic/watt-perf-demos-api:experiment-latest
        build-args: |
          COMMIT_HASH=${{ github.sha }}
          BUILD_TIME=${{ github.event.repository.updated_at }}

  build-next:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to registry
      uses: docker/login-action@v3
      with:
        username: plfmzugm
        password: ${{ secrets.DOCKER_TOKEN }}

    - name: Build and push image
      uses: docker/build-push-action@v6
      with:
        context: ./demos/next
        file: ./demos/next/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          platformatic/watt-perf-demos-next:experiment-latest
        build-args: |
          COMMIT_HASH=${{ github.sha }}
          BUILD_TIME=${{ github.event.repository.updated_at }}
